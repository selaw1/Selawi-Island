[package]
name = "selawi-island"
description = "Selawi Island command-line client"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "selawi-island"
path = "src/main.rs"

[dependencies]
selawi-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
tokio = { version = "1", features = ["rt", "macros", "signal"] }

[lints]
workspace = true
