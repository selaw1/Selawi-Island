[package]
name = "selawi-islandd"
description = "Selawi Island daemon: event engine on the D-Bus session bus"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "selawi_islandd"
path = "src/lib.rs"

[[bin]]
name = "selawi-islandd"
path = "src/main.rs"

[dependencies]
selawi-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "sync", "fs"] }
zbus = { version = "6", default-features = false, features = ["tokio", "service", "proxy"] }

[lints]
workspace = true

[dev-dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "service", "proxy", "object-manager"] }
