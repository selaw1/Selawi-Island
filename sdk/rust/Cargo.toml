[package]
name = "selawi-island-plugin"
description = "Show your app's own events on Selawi Island (Plugins1 over D-Bus)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false }
serde_json = "1"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[dev-dependencies]
selawi-core = { path = "../../core" }
selawi-islandd = { path = "../../daemon" }
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lints]
workspace = true
